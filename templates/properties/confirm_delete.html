{% extends 'base.html' %}
{% block title %}Delete property{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card shadow-sm border-danger"><div class="card-body p-4">
    <h4>Delete "{{ property.title }}"?</h4>
    <p class="text-muted">This also removes its rental requests and reviews. This cannot be undone.</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger">Yes, delete</button>
      <a href="{% url 'rentals:owner_dashboard' %}" class="btn btn-light">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
