<div class="row g-3 mb-4">
  {% for label, value, color in stats %}
  <div class="col-6 col-md">
    <div class="card text-bg-{{ color }} shadow-sm">
      <div class="card-body py-3">
        <div class="fs-2 fw-bold">{{ value }}</div>
        <div class="small">{{ label }}</div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
